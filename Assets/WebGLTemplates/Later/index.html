<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LATER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z' fill='%23141414'/%3E%3C/svg%3E">
<style>
  /* the page is the game: paper behind it, no scrolling, zooming or selecting */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: rgb(253,220,172); touch-action: none; overscroll-behavior: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; background: rgb(253,220,172); }
  /* loading: a thin ink bar */
  #bar { position: fixed; left: 50%; top: 50%; width: 160px; height: 3px; margin: -1.5px 0 0 -80px; background: rgba(20,20,20,.15); }
  #bar i { display: block; width: 0; height: 100%; background: #141414; }
  #bar.failed { width: 80vw; height: auto; margin-left: -40vw; background: none; font: 14px/1.4 sans-serif; color: #141414; text-align: center; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="bar"><i></i></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
  var bar = document.getElementById("bar");
  createUnityInstance(document.getElementById("unity-canvas"), {
    arguments: [],
    dataUrl: "Build/{{{ DATA_FILENAME }}}",
    frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
    workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
    codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
    symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
  }, function (progress) {
    bar.firstChild.style.width = (100 * progress) + "%";
  }).then(function () {
    bar.remove();
  }).catch(function (message) {
    console.error(message);
    bar.className = "failed";
    bar.textContent = "LATER couldn't start in this browser: " + message;
    if (/^#test/.test(location.hash)) document.title = "FAIL load: " + message;
  });
</script>
</body>
</html>
